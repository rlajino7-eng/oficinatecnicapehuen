<!-- Filtro de Categorías -->
<select id="filtroCategoria" onchange="filtrarArchivos()">
    <option value="TODOS">Todas las categorías</option>
    <option value="PLANO">Planos</option>
    <option value="INFORME">Informes</option>
    <option value="GENERAL">General</option>
</select>

<!-- Tabla de archivos -->
<table id="tablaArchivos">
    <thead>
        <tr>
            <th>Categoría</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="listaArchivos">
        <!-- Aquí se cargarán los archivos automáticamente -->
    </tbody>
</table>

<script>
async function cargarArchivos() {
    const res = await fetch('/api/archivos');
    const archivos = await res.json();
    const lista = document.getElementById('listaArchivos');
    lista.innerHTML = '';
    
    archivos.forEach(a => {
        lista.innerHTML += `
            <tr>
                <td>${a.categoria}</td>
                <td><a href="${a.webViewLink}" target="_blank">${a.name}</a></td>
                <td>
                    <button onclick="reemplazarArchivo('${a.id}')" style="background:blue; color:white;">Actualizar</button>
                    <button onclick="eliminarArchivo('${a.id}')" style="background:red; color:white;">Eliminar</button>
                </td>
            </tr>`;
    });
}

async function eliminarArchivo(id) {
    if(confirm('¿Seguro que deseas eliminar este archivo de Drive?')) {
        await fetch(`/api/archivos/${id}`, { method: 'DELETE' });
        cargarArchivos();
    }
}
</script>
