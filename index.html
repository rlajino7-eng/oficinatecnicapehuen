<!-- MODIFICACIÓN: AGREGAR FILTRO DE CATEGORÍAS ANTES DE LA TABLA -->
<section class="toolbar">
    <div class="status-indicator">
        <span class="pulse-green"></span>
        <strong>Conectado a Google Drive Corporativo</strong>
    </div>
    
    <!-- Filtro -->
    <select id="filtroCategoria" onchange="renderizarTabla()">
        <option value="TODOS">Todas las categorías</option>
        <option value="PLANO">Planos</option>
        <option value="INFORME">Informes</option>
        <option value="GENERAL">General</option>
    </select>

    <form id="formSubir" class="upload-area">
        <label for="archivoInput" class="btn-select">📁 Seleccionar Documento</label>
        <input type="file" id="archivoInput" required style="display: none;">
        <span id="nombreSeleccionado" class="file-name">Ningún archivo...</span>
        <button type="submit" class="btn-upload">⬆ Subir a Drive</button>
    </form>
</section>

<!-- TABLA DE DOCUMENTOS (ACTUALIZADA) -->
<section class="table-container">
    <table class="tech-table">
        <thead>
            <tr>
                <th>CATEGORÍA</th>
                <th>NOMBRE DEL ARCHIVO / DOCUMENTO TÉCNICO</th>
                <th>FECHA REGISTRO</th>
                <th>ACCIONES CORPORATIVAS</th>
            </tr>
        </thead>
        <tbody id="listaArchivos">
            <!-- Los botones de eliminar/actualizar aparecerán aquí -->
        </tbody>
    </table>
</section>
